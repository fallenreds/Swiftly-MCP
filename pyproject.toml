[project]
name = "swiftly-mcp"
version = "1.0.0"
description = "MCP server for Swiftly (https://swiftly.cc) — meeting recording and transcription platform"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
swiftly-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
